name: Auto Extract Zip to Repo

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

# GitHub Actions ko repository me push karne ki permission
permissions:
  contents: write

jobs:
  extract_and_push:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT
      # ============================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================
      # 2. CONFIGURE GIT
      # ============================================
      - name: Configure Git
        shell: bash
        run: |
          set -e

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "================================"
          echo "Git configuration"
          echo "================================"

          echo "Name:"
          git config --local user.name

          echo "Email:"
          git config --local user.email

          echo "================================"

      # ============================================
      # 3. SYNC WITH LATEST MAIN
      # ============================================
      - name: Sync With Latest Main
        shell: bash
        run: |
          set -e

          echo "Fetching latest main..."

          git fetch --prune origin main

          git checkout main

          git reset --hard origin/main

          echo "Repository synced with latest main."

      # ============================================
      # 4. FIND AND EXTRACT ZIP
      # ============================================
      - name: Extract Zip File
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "================================"
            echo "ERROR: No ZIP file found!"
            echo "================================"
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          # Temporary extraction directory
          rm -rf temp_extract
          mkdir -p temp_extract

          echo "Extracting ZIP..."

          unzip -q "$ZIP_FILE" -d temp_extract

          echo "ZIP extraction completed."

          # Never copy uploaded Git metadata into this repository
          find temp_extract -type d -name ".git" -prune -exec rm -rf {} +

          # Remove original ZIP
          rm -f "$ZIP_FILE"

          # Include hidden files
          shopt -s dotglob nullglob

          ITEMS=(temp_extract/*)

          echo "Items extracted: ${#ITEMS[@]}"

          # ============================================
          # SINGLE ROOT DIRECTORY
          # ============================================
          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then

            ROOT_DIR="${ITEMS[0]}"

            echo "Single root directory detected:"
            echo "$ROOT_DIR"

            cp -a "$ROOT_DIR"/. ./

          else

            echo "Files are directly inside ZIP."

            cp -a temp_extract/. ./

          fi

          # Cleanup
          rm -rf temp_extract

          echo "================================"
          echo "Extraction completed successfully"
          echo "================================"

      # ============================================
      # 5. COMMIT
      # ============================================
      - name: Commit Changes
        shell: bash
        run: |
          set -e

          echo "Checking changes..."

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          echo "Changes detected."

          # Explicit author + committer.
          # This avoids the 'empty ident name' error.
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"

          export GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"

          echo "Creating commit..."

          git commit \
            --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            -m "commit"

          echo "Commit created successfully."

      # ============================================
      # 6. PUSH
      # ============================================
      - name: Push Changes
        shell: bash
        run: |
          set -e

          MAX_RETRIES=5

          for ATTEMPT in $(seq 1 $MAX_RETRIES); do

            echo "================================"
            echo "Push attempt $ATTEMPT/$MAX_RETRIES"
            echo "================================"

            if git push origin HEAD:main; then
              echo "================================"
              echo "SUCCESS: Changes pushed!"
              echo "================================"
              exit 0
            fi

            if [ "$ATTEMPT" -eq "$MAX_RETRIES" ]; then
              echo "================================"
              echo "ERROR: Push failed after $MAX_RETRIES attempts."
              echo "================================"
              exit 1
            fi

            echo "Remote branch changed."
            echo "Fetching latest main..."

            git fetch --prune origin main

            echo "Rebasing..."

            # Reconfigure identity in case rebase invokes Git
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if ! git rebase origin/main; then
              echo "================================"
              echo "ERROR: Rebase conflict detected."
              echo "================================"

              git rebase --abort || true

              exit 1
            fi

            echo "Rebase successful."

            sleep 2

          done
